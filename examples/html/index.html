<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Game</title>
  </head>
  <body>
    <iframe 
      src="https://demo-24748543997.us-central1.run.app?operatorId=demo&gameId=blocks&language=en"
      id="games_iframe"
      allow="clipboard-write; clipboard-read;"
      style="position:fixed; top:0; left:0; bottom:0; right:0; width:100%; height:100%; border:none; margin:0; padding:0; overflow:hidden; z-index:999999;">
        Your browser doesn't support iframes
    </iframe>
    <script type="module">
      import { initGame, destroyGame, enableLogging, demoBalance  } from '/thndr-sdk.js';
    
      // Using the "demo" operatorId will allow you to test the integration with the demo 
      // environment and now s2s required.
      //
      // Demo URL https://demo-24748543997.us-central1.run.app
      // Sandbox URL https://game-sandbox.thndr-cdn.com    
      // Production URL https://game.thndr-cdn.com
    
      function getToken() {
        return "demo"; // Replace with jwt token
      }
    
      function getBalance() {
        return {
          balance: demoBalance, // Replace with your balance
          currency: "cents", // Replace with your currency
        };
      }
    
      function closeIframe(location) {
        // Either a string "close" or "lobby"
        // All cases it will return "close" unless the "lobby" feature is enabled for your operator ID.
        console.log("Close the iFrame", location);
      }

      function handlePaymentError(error) {
        return {
          action: "RETRY", // RETRY, GENERIC_ERROR, OPERATOR_ERROR, IGNORE
          // message: "Custom error meesage defined by the operator." // Custom error message for use with OPERATOR_ERROR action only
        };
      }

      function analyticsEvent(name) {
        console.log("Analytics event:", name);
      }

       // enableLogging(); // Optional, enable logging for debugging

      // initGame resolves to a `destroy` function. Capture it and call it when
      // the game is unmounted or the user navigates away (e.g. on a SPA route
      // change or component teardown) so the SDK's message listener is removed
      // and does not accumulate. Alternatively, call destroyGame("games_iframe").
      let destroyGameListener;
      initGame(
        "games_iframe",
        "https://demo-24748543997.us-central1.run.app",
        getToken,
        getBalance,
        closeIframe,
        handlePaymentError,
        analyticsEvent
      ).then((destroy) => {
        destroyGameListener = destroy;
      });

      // This static demo has no in-app navigation, so clean up on page unload to
      // illustrate where a real app would tear the listener down.
      window.addEventListener("beforeunload", () => {
        destroyGameListener?.();
        // Equivalent: destroyGame("games_iframe");
      });
    </script>
  </body>
</html>
